name: now-playing

# Redraws assets/now-playing.svg from Last.fm.
# Dormant until the repo variable LASTFM_USER and secret LASTFM_API_KEY exist.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: now-playing
  cancel-in-progress: true

jobs:
  render:
    if: vars.LASTFM_USER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0
      - run: python scripts/build.py music
        env:
          LASTFM_USER: ${{ vars.LASTFM_USER }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      - name: Commit if changed
        run: |
          git diff --quiet assets/now-playing.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/now-playing.svg
          git commit -m "now playing"
          git push
