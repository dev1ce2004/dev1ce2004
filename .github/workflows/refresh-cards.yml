name: refresh-cards

# Songs (assets/now-playing.svg) at 00:00 and 14:00 Split time; stats (assets/stats.svg) daily at 14:00.
# Times are CET; GitHub cron is UTC with no daylight saving, so add an hour in summer.
on:
  schedule:
    - cron: "0 23 * * *"  # 00:00 Split: songs only
    - cron: "0 13 * * *"  # 14:00 Split: songs + stats
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0
      - run: python scripts/build.py ${{ github.event.schedule == '0 23 * * *' && 'music' || 'live' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git diff --quiet assets/ README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/now-playing.svg assets/stats.svg README.md
          git commit -m "refresh cards"
          git push
